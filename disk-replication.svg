<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="'Helvetica Neue','Arial',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAFBFC"/>
      <stop offset="1" stop-color="#EEF0F4"/>
    </linearGradient>
    <marker id="aB" markerWidth="14" markerHeight="14" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,5 L0,10 Z" fill="#0A3CD9"/>
    </marker>
    <marker id="aO" markerWidth="14" markerHeight="14" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,5 L0,10 Z" fill="#FF6A00"/>
    </marker>
    <symbol id="ecs" viewBox="0 0 70 64">
      <rect x="2" y="2"  width="66" height="16" rx="4" fill="#0A3CD9"/><circle cx="56" cy="10" r="4" fill="#FFFFFF"/>
      <rect x="2" y="24" width="66" height="16" rx="4" fill="#0A3CD9"/><circle cx="56" cy="32" r="4" fill="#FFFFFF"/>
      <rect x="2" y="46" width="66" height="16" rx="4" fill="#0A3CD9"/><circle cx="56" cy="54" r="4" fill="#FFFFFF"/>
    </symbol>
    <symbol id="disk" viewBox="0 0 80 80">
      <path d="M40,3 L77,40 L40,77 L3,40 Z" fill="#0A3CD9"/>
      <path d="M40,22 L58,40 L40,58 L22,40 Z" fill="#FFFFFF" fill-opacity="0.28"/>
      <path d="M30,12 L40,22 L50,12" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
      <path d="M30,68 L40,58 L50,68" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    </symbol>
  </defs>
  <rect x="0" y="0" width="1200" height="900" fill="url(#bg)"/>

  <!-- brand -->
  <text x="700" y="40" font-size="18" font-weight="800" fill="#0A3CD9" letter-spacing="0.5">ALIBABA CLOUD INTELLIGENCE</text>
  <text x="1040" y="40" font-size="18" font-weight="800" fill="#8A8F99" letter-spacing="0.5">GROUP</text>

  <!-- region boxes -->
  <rect x="60"  y="80" width="480" height="780" rx="6" fill="none" stroke="#2B2F36" stroke-width="2.5" stroke-dasharray="10 8"/>
  <rect x="660" y="80" width="480" height="780" rx="6" fill="none" stroke="#2B2F36" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="300" y="140" text-anchor="middle" font-size="26" fill="#2B2F36">Region A Zone A</text>
  <text x="900" y="140" text-anchor="middle" font-size="26" fill="#2B2F36">Region A Zone B</text>

  <!-- ECS -->
  <use href="#ecs" x="265" y="190" width="70" height="64"/>
  <use href="#ecs" x="865" y="190" width="70" height="64"/>
  <text x="300" y="300" text-anchor="middle" font-size="26" fill="#5A6270">ECS</text>
  <text x="900" y="300" text-anchor="middle" font-size="26" fill="#5A6270">ECS</text>

  <!-- dotted ECS->Disk -->
  <line x1="300" y1="330" x2="300" y2="470" stroke="#9AA3B2" stroke-width="2.5" stroke-dasharray="3 8" stroke-linecap="round"/>
  <line x1="900" y1="330" x2="900" y2="470" stroke="#9AA3B2" stroke-width="2.5" stroke-dasharray="3 8" stroke-linecap="round"/>

  <!-- Disks -->
  <use href="#disk" x="252" y="492" width="96" height="96"/>
  <use href="#disk" x="852" y="492" width="96" height="96"/>
  <text x="300" y="640" text-anchor="middle" font-size="26" fill="#5A6270">Primary</text>
  <text x="300" y="672" text-anchor="middle" font-size="26" fill="#5A6270">Disk</text>
  <text x="900" y="640" text-anchor="middle" font-size="26" fill="#5A6270">Secondary</text>
  <text x="900" y="672" text-anchor="middle" font-size="26" fill="#5A6270">Disk</text>

  <!-- async replication arrow -->
  <line x1="360" y1="540" x2="840" y2="540" stroke="#0A3CD9" stroke-width="3" marker-end="url(#aB)"/>
  <text x="600" y="478" text-anchor="middle" font-size="24" fill="#2B2F36">Asynchronous</text>
  <text x="600" y="506" text-anchor="middle" font-size="24" fill="#2B2F36">replication</text>

  <!-- failover / data restoration dashed curve back -->
  <path d="M845,720 Q600,820 355,720" fill="none" stroke="#FF6A00" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#aO)"/>
  <text x="600" y="760" text-anchor="middle" font-size="24" fill="#2B2F36">Failover</text>
  <text x="600" y="790" text-anchor="middle" font-size="24" fill="#2B2F36">Data restoration</text>
</svg>
