  <line x1="150" y1="502" x2="1350" y2="502" stroke="#D2D6DC" stroke-width="1.2"/>
  <g stroke="#D2D6DC" stroke-width="1.2"><line x1="440" y1="502" x2="440" y2="630"/><line x1="750" y1="502" x2="750" y2="630"/><line x1="1060" y1="502" x2="1060" y2="630"/></g>
  <g text-anchor="middle">
