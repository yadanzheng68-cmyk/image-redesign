<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="680" viewBox="0 0 1500 680" font-family="'WenQuanYi Zen Hei','Helvetica Neue','Arial',sans-serif">
  <defs>
