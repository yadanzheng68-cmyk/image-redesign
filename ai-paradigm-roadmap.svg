    <marker id="arBig" markerWidth="13" markerHeight="13" refX="8" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,6 L0,12 Z" fill="#0A3CD9"/></marker>
  </defs>

  <rect x="0" y="0" width="1500" height="680" fill="#FFFFFF"/>
