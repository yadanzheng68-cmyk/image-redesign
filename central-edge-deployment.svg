  <g fill="#2B2F36">
    <rect x="1286" y="636" width="22" height="60" rx="2"/><rect x="1311" y="636" width="22" height="60" rx="2"/><rect x="1336" y="636" width="22" height="60" rx="2"/>
  </g>
  <g fill="#5A8AF0"><rect x="1290" y="642" width="14" height="3"/><rect x="1290" y="650" width="14" height="3"/><rect x="1315" y="642" width="14" height="3"/><rect x="1315" y="650" width="14" height="3"/><rect x="1340" y="642" width="14" height="3"/><rect x="1340" y="650" width="14" height="3"/></g>
  <text x="1322" y="730" text-anchor="middle" font-size="15" font-style="italic" fill="#5A6270">AI Stack (Cluster)</text>
