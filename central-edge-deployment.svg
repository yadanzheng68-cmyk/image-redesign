  <text x="585" y="602" text-anchor="middle" font-size="15" font-weight="600" fill="#0A3CD9">AZ2 (Active)</text>
  <text x="480" y="688" text-anchor="middle" font-size="15" font-weight="600" fill="#0A3CD9">AZ3 (DR)</text>

