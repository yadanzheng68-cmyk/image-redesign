  <g><rect x="1308" y="436" width="30" height="56" rx="3" fill="#2B2F36"/><g fill="#5A8AF0"><rect x="1313" y="442" width="20" height="4" rx="2"/><rect x="1313" y="451" width="20" height="4" rx="2"/><rect x="1313" y="460" width="20" height="4" rx="2"/></g><circle cx="1316" cy="483" r="3" fill="#5A8AF0"/></g>
