<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" font-family="'Helvetica Neue','Arial',sans-serif">
  <defs>
    <linearGradient id="barG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1FB8E8"/><stop offset="1" stop-color="#0AA2DC"/></linearGradient>
    <linearGradient id="lbG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#BFE0FF"/><stop offset="1" stop-color="#5AA9F5"/></linearGradient>
    <linearGradient id="curveG" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#9CC2EE"/><stop offset="1" stop-color="#4A86D8"/></linearGradient>
    <marker id="ar" markerWidth="11" markerHeight="11" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#5A6270"/></marker>

    <!-- one blue server bar -->
    <symbol id="bar" viewBox="0 0 90 22">
      <rect x="0" y="0" width="90" height="22" rx="3" fill="url(#barG)"/>
      <circle cx="74" cy="11" r="4.5" fill="#FFFFFF"/>
    </symbol>

    <!-- RDS = Alibaba Cloud ApsaraDB hexagon mark (two overlapping hexes + 3-triangle motif) -->
    <symbol id="rds" viewBox="0 0 130 120">
      <!-- back hexagon (lighter), offset upper-right -->
      <polygon points="80,16 110,33 110,67 80,84 50,67 50,33" fill="#5FD4F3"/>
      <!-- front hexagon (main) -->
      <polygon points="46,36 76,53 76,87 46,104 16,87 16,53" fill="#13B5E6"/>
      <!-- white three-triangle motif on front hexagon, centered ~(46,70) -->
      <polygon points="32,60 60,60 46,80" fill="#FFFFFF"/>
      <polygon points="30,84 44,84 37,70" fill="#FFFFFF"/>
      <polygon points="48,84 62,84 55,70" fill="#FFFFFF"/>
    </symbol>

    <!-- phone icon -->
    <symbol id="phone" viewBox="0 0 60 100">
      <rect x="8" y="4" width="44" height="92" rx="8" fill="none" stroke="#13B5E6" stroke-width="4"/>
      <rect x="16" y="16" width="28" height="62" rx="2" fill="#CFEFFA"/>
      <circle cx="30" cy="87" r="4" fill="#13B5E6"/>
    </symbol>

    <!-- monitor icon -->
    <symbol id="pc" viewBox="0 0 110 90">
      <rect x="6" y="6" width="98" height="62" rx="6" fill="none" stroke="#13B5E6" stroke-width="4"/>
      <rect x="16" y="16" width="78" height="42" rx="2" fill="#CFEFFA"/>
      <rect x="44" y="68" width="22" height="10" fill="#13B5E6"/>
      <rect x="30" y="78" width="50" height="7" rx="3" fill="#13B5E6"/>
    </symbol>

    <!-- cloud monitor icon -->
    <symbol id="cmon" viewBox="0 0 90 70">
      <path d="M22,52 C8,52 4,34 20,32 C18,14 46,12 50,28 C66,22 78,40 64,52 Z" fill="none" stroke="#9AA3B2" stroke-width="3"/>
      <circle cx="42" cy="58" r="9" fill="none" stroke="#13B5E6" stroke-width="3"/>
      <circle cx="42" cy="58" r="3" fill="#13B5E6"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="1500" height="820" fill="#FFFFFF"/>
  <text x="1040" y="36" font-size="16" font-weight="800" fill="#0A3CD9" letter-spacing="0.5">ALIBABA CLOUD INTELLIGENCE</text>
  <text x="1352" y="36" font-size="16" font-weight="800" fill="#8A8F99" letter-spacing="0.5">GROUP</text>

  <!-- ===================== CLIENT SIDE ===================== -->
  <rect x="95" y="120" width="190" height="330" rx="6" fill="none" stroke="#FF6A00" stroke-width="1.6" stroke-dasharray="7 6"/>
  <use href="#phone" x="158" y="150" width="60" height="100"/>
  <text x="190" y="290" text-anchor="middle" font-size="18" fill="#1A1A1A">Mobile side</text>
  <use href="#pc" x="133" y="320" width="110" height="90"/>
  <text x="190" y="438" text-anchor="middle" font-size="18" fill="#1A1A1A">PC side</text>

  <!-- client -> LB -->
  <path d="M218,200 H262 V285" fill="none" stroke="#5A6270" stroke-width="1.6"/>
  <path d="M188,365 H262 V285" fill="none" stroke="#5A6270" stroke-width="1.6"/>
  <line x1="262" y1="285" x2="345" y2="285" stroke="#5A6270" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- ===================== LOAD BALANCER ===================== -->
  <g transform="translate(430,285)">
    <polygon points="-58,0 0,-34 58,0 0,34" fill="url(#lbG)" stroke="#5AA9F5" stroke-width="1.5"/>
    <polygon points="-58,0 0,-34 0,0" fill="#A9D2FB" opacity="0.6"/>
    <circle cx="0" cy="-12" r="5" fill="#0A3CD9"/>
    <circle cx="-16" cy="8" r="5" fill="#0A3CD9"/>
    <circle cx="16" cy="8" r="5" fill="#0A3CD9"/>
    <path d="M0,-12 L-16,8 M0,-12 L16,8 M-16,8 L16,8" stroke="#0A3CD9" stroke-width="2" fill="none"/>
  </g>
  <text x="430" y="360" text-anchor="middle" font-size="18" fill="#1A1A1A">Load Balancer</text>

  <!-- LB -> ECS -->
  <line x1="490" y1="285" x2="600" y2="285" stroke="#5A6270" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- ===================== ECS INSTANCE COLUMN ===================== -->
  <!-- dashed orange envelope (CloudMonitor scope) -->
  <rect x="615" y="95" width="225" height="475" rx="6" fill="none" stroke="#FF6A00" stroke-width="1.6" stroke-dasharray="7 6"/>
  <!-- cloud monitor -->
  <use href="#cmon" x="650" y="40" width="80" height="62"/>
  <text x="690" y="118" text-anchor="middle" font-size="16" fill="#1A1A1A">CloudMonitor</text>

  <!-- gray ECS box -->
  <rect x="745" y="70" width="150" height="480" rx="4" fill="#ECEDEF" stroke="#D2D6DC" stroke-width="1.5"/>
  <text x="820" y="98" text-anchor="middle" font-size="17" font-weight="600" fill="#1A1A1A">ECS instance</text>
  <!-- three groups of 3 server bars -->
  <g>
    <use href="#bar" x="765" y="118" width="110" height="26"/>
    <use href="#bar" x="765" y="152" width="110" height="26"/>
    <use href="#bar" x="765" y="186" width="110" height="26"/>

    <use href="#bar" x="765" y="246" width="110" height="26"/>
    <use href="#bar" x="765" y="280" width="110" height="26"/>
    <use href="#bar" x="765" y="314" width="110" height="26"/>

    <use href="#bar" x="765" y="374" width="110" height="26"/>
    <use href="#bar" x="765" y="408" width="110" height="26"/>
    <use href="#bar" x="765" y="442" width="110" height="26"/>
  </g>

  <!-- ECS -> RDS -->
  <line x1="895" y1="285" x2="1000" y2="285" stroke="#5A6270" stroke-width="1.8"/>
  <path d="M1000,285 V165 H1110" fill="none" stroke="#5A6270" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M1000,285 V415 H1110" fill="none" stroke="#5A6270" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- ===================== RDS INSTANCES ===================== -->
  <use href="#rds" x="1135" y="105" width="135" height="124"/>
  <use href="#rds" x="1135" y="355" width="135" height="124"/>
  <text x="1202" y="520" text-anchor="middle" font-size="18" fill="#1A1A1A">RDS instance</text>

  <!-- ===================== SCALING-OUT GROUP ===================== -->
  <!-- new server group (bottom-left of ECS) -->
  <g>
    <use href="#bar" x="475" y="585" width="110" height="26"/>
    <use href="#bar" x="475" y="619" width="110" height="26"/>
    <use href="#bar" x="475" y="653" width="110" height="26"/>
  </g>
  <!-- big curved gradient arrow into ECS column -->
  <path d="M590,648 C700,722 772,706 798,592"
        fill="none" stroke="url(#curveG)" stroke-width="14" stroke-linecap="round"/>
  <path d="M798,572 L778,606 L822,600 Z" fill="#4A86D8"/>
</svg>
