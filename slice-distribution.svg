<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="'Helvetica Neue','Arial',sans-serif">
  <defs>
    <linearGradient id="gTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FBEFA"/><stop offset="1" stop-color="#4A8AEE"/>
    </linearGradient>
    <linearGradient id="gFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E63E8"/><stop offset="1" stop-color="#143FBE"/>
    </linearGradient>
    <linearGradient id="gSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1C4ED8"/><stop offset="1" stop-color="#0A2E9E"/>
    </linearGradient>
    <linearGradient id="gPed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B6BECA"/><stop offset="1" stop-color="#828B9B"/>
    </linearGradient>
    <linearGradient id="gPool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4F84F5"/><stop offset="1" stop-color="#0A3CD9"/>
    </linearGradient>
    <linearGradient id="gPoolTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FB0FA"/><stop offset="1" stop-color="#4F84F5"/>
    </linearGradient>
    <linearGradient id="gNode" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A93F6"/><stop offset="1" stop-color="#0A3CD9"/>
    </linearGradient>
    <linearGradient id="gDoc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7EE"/><stop offset="1" stop-color="#FFE3C4"/>
    </linearGradient>
    <linearGradient id="chev" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A3CD9"/><stop offset="1" stop-color="#FF6A00"/>
    </linearGradient>
    <marker id="aO" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#FF6A00"/>
    </marker>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#3a4862" flood-opacity="0.30"/>
    </filter>

    <!-- orange sliced-file icon -->
    <symbol id="docO" viewBox="0 0 66 84">
      <path d="M4,4 H42 L62,22 V80 H4 Z" fill="url(#gDoc)" stroke="#E85D00" stroke-width="3" stroke-linejoin="round"/>
      <path d="M42,4 V22 H62" fill="none" stroke="#E85D00" stroke-width="3" stroke-linejoin="round"/>
      <rect x="13" y="34" width="30" height="5.5" rx="2.7" fill="#FF6A00"/>
      <rect x="13" y="48" width="40" height="5.5" rx="2.7" fill="#FF6A00"/>
      <rect x="13" y="62" width="40" height="5.5" rx="2.7" fill="#FF6A00"/>
    </symbol>

    <!-- storage node cylinder -->
    <symbol id="db" viewBox="0 0 104 100">
      <path d="M6,24 V76 A46,18 0 0 0 98,76 V24 Z" fill="url(#gNode)"/>
      <ellipse cx="52" cy="24" rx="46" ry="18" fill="#6AA0F8"/>
      <ellipse cx="52" cy="24" rx="46" ry="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
      <path d="M6,47 A46,18 0 0 0 98,47" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2.5"/>
      <path d="M6,63 A46,18 0 0 0 98,63" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2.5"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="1400" height="640" fill="#FFFFFF"/>

  <!-- brand -->
  <text x="990" y="42" font-size="17" font-weight="800" fill="#0A3CD9" letter-spacing="0.5">ALIBABA CLOUD INTELLIGENCE</text>
  <text x="1300" y="42" font-size="17" font-weight="800" fill="#8A8F99" letter-spacing="0.5">GROUP</text>

  <!-- =================== LEFT: source storage device (3D) =================== -->
  <!-- dashed removable-slice outline -->
  <polygon points="92,300 140,252 140,392 92,440" fill="none" stroke="#9AA3B2" stroke-width="2" stroke-dasharray="7 6"/>
  <g filter="url(#sh)">
    <!-- right side face -->
    <polygon points="460,232 552,160 552,322 460,394" fill="url(#gSide)"/>
    <!-- front face -->
    <polygon points="140,232 460,232 460,394 140,394" fill="url(#gFront)"/>
    <!-- top face -->
    <polygon points="140,232 232,160 552,160 460,232" fill="url(#gTop)"/>
  </g>
  <!-- top gloss -->
  <polygon points="150,228 236,166 420,166 350,228" fill="#FFFFFF" fill-opacity="0.12"/>
  <!-- front panel: holes -->
  <circle cx="186" cy="278" r="11" fill="#0A2E9E"/><circle cx="186" cy="278" r="11" fill="none" stroke="#8FB6F5" stroke-width="2.5"/>
  <circle cx="186" cy="320" r="11" fill="#0A2E9E"/><circle cx="186" cy="320" r="11" fill="none" stroke="#8FB6F5" stroke-width="2.5"/>
  <!-- front panel: drive slots -->
  <g>
    <rect x="248" y="262" width="30" height="104" rx="5" fill="#0A2E9E"/><rect x="252" y="266" width="8" height="96" rx="4" fill="#3A6BF0" fill-opacity="0.7"/>
    <rect x="300" y="262" width="30" height="104" rx="5" fill="#0A2E9E"/><rect x="304" y="266" width="8" height="96" rx="4" fill="#3A6BF0" fill-opacity="0.7"/>
    <rect x="352" y="262" width="30" height="104" rx="5" fill="#0A2E9E"/><rect x="356" y="266" width="8" height="96" rx="4" fill="#3A6BF0" fill-opacity="0.7"/>
  </g>
  <!-- pedestal (iso block) -->
  <g filter="url(#sh)">
    <polygon points="300,182 336,158 416,158 380,182" fill="url(#gPed)"/>
    <polygon points="380,182 416,158 416,200 380,224" fill="#6E7686"/>
    <polygon points="300,182 380,182 380,224 300,224" fill="#9AA3B2"/>
  </g>
  <!-- source document (white/blue) on pedestal -->
  <g filter="url(#sh)" transform="translate(306,58)">
    <path d="M4,4 H44 L66,24 V128 H4 Z" fill="#FFFFFF" stroke="#0A3CD9" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M44,4 V24 H66" fill="none" stroke="#0A3CD9" stroke-width="3.5" stroke-linejoin="round"/>
    <rect x="6" y="6" width="38" height="18" fill="#2E5BEA" fill-opacity="0.18"/>
    <rect x="14" y="46" width="30" height="6" rx="3" fill="#0A3CD9"/>
    <rect x="14" y="64" width="42" height="6" rx="3" fill="#0A3CD9"/>
    <rect x="14" y="82" width="42" height="6" rx="3" fill="#0A3CD9"/>
    <rect x="14" y="100" width="32" height="6" rx="3" fill="#0A3CD9"/>
  </g>

  <!-- =================== MIDDLE: Slice =================== -->
  <text x="720" y="158" text-anchor="middle" font-size="38" font-weight="700" fill="#1A1A1A">Slice</text>
  <g fill="none" stroke="url(#chev)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="636,182 668,214 636,246"/>
    <polyline points="678,182 710,214 678,246"/>
    <polyline points="720,182 752,214 720,246"/>
    <polyline points="762,182 794,214 762,246"/>
  </g>

  <!-- =================== RIGHT: storage pool + slices =================== -->
  <g filter="url(#sh)">
    <path d="M900,242 V306 A180,42 0 0 0 1260,306 V242 Z" fill="url(#gPool)"/>
    <ellipse cx="1080" cy="242" rx="180" ry="42" fill="url(#gPoolTop)"/>
    <ellipse cx="1080" cy="242" rx="180" ry="42" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2"/>
  </g>

  <!-- highlight disc behind first slice -->
  <circle cx="986" cy="196" r="64" fill="#FF6A00" fill-opacity="0.15"/>
  <circle cx="986" cy="196" r="64" fill="none" stroke="#FF6A00" stroke-width="4"/>

  <!-- three slice files on top -->
  <g filter="url(#sh)">
    <use href="#docO" x="952"  y="150" width="66" height="84"/>
    <use href="#docO" x="1060" y="150" width="66" height="84"/>
    <use href="#docO" x="1168" y="150" width="66" height="84"/>
  </g>

  <!-- three storage nodes -->
  <g filter="url(#sh)">
    <use href="#db" x="900"  y="470" width="104" height="100"/>
    <use href="#db" x="1028" y="470" width="104" height="100"/>
    <use href="#db" x="1198" y="470" width="104" height="100"/>
  </g>

  <!-- distribution arrows from highlighted slice to nodes -->
  <line x1="978"  y1="256" x2="952"  y2="466" stroke="#FF6A00" stroke-width="3.2" marker-end="url(#aO)"/>
  <line x1="994"  y1="258" x2="1080" y2="466" stroke="#FF6A00" stroke-width="3.2" marker-end="url(#aO)"/>
  <line x1="1010" y1="256" x2="1250" y2="466" stroke="#FF6A00" stroke-width="3.2" marker-end="url(#aO)"/>
</svg>
