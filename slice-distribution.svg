<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" font-family="'Helvetica Neue','Arial',sans-serif">
  <defs>
    <linearGradient id="chev" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A3CD9"/><stop offset="1" stop-color="#FF6A00"/>
    </linearGradient>
    <linearGradient id="poolG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E5BEA"/><stop offset="1" stop-color="#0A3CD9"/>
    </linearGradient>
    <linearGradient id="dbG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A6BF0"/><stop offset="1" stop-color="#0A3CD9"/>
    </linearGradient>
    <marker id="aO" markerWidth="13" markerHeight="13" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#FF6A00"/>
    </marker>

    <!-- orange sliced-file document -->
    <symbol id="docO" viewBox="0 0 60 78">
      <path d="M3,3 H40 L57,20 V75 H3 Z" fill="#FFF1E2" stroke="#FF6A00" stroke-width="3" stroke-linejoin="round"/>
      <path d="M40,3 V20 H57" fill="none" stroke="#FF6A00" stroke-width="3" stroke-linejoin="round"/>
      <line x1="11" y1="34" x2="38" y2="34" stroke="#FF6A00" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="11" y1="46" x2="48" y2="46" stroke="#FF6A00" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="11" y1="58" x2="48" y2="58" stroke="#FF6A00" stroke-width="3.5" stroke-linecap="round"/>
    </symbol>

    <!-- small storage cylinder -->
    <symbol id="db" viewBox="0 0 100 96">
      <path d="M6,22 V74 A44,18 0 0 0 94,74 V22 Z" fill="url(#dbG)"/>
      <ellipse cx="50" cy="22" rx="44" ry="18" fill="#4F84F5"/>
      <path d="M6,44 A44,18 0 0 0 94,44" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2.5"/>
      <path d="M6,60 A44,18 0 0 0 94,60" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2.5"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="1400" height="620" fill="#FFFFFF"/>

  <!-- brand -->
  <text x="990" y="44" font-size="17" font-weight="800" fill="#0A3CD9" letter-spacing="0.5">ALIBABA CLOUD INTELLIGENCE</text>
  <text x="1300" y="44" font-size="17" font-weight="800" fill="#8A8F99" letter-spacing="0.5">GROUP</text>

  <!-- =================== LEFT: source storage device =================== -->
  <!-- dashed slice extension -->
  <polygon points="60,240 100,200 100,360 60,400" fill="none" stroke="#9AA3B2" stroke-width="2" stroke-dasharray="7 6"/>
  <!-- box: top, right, front faces -->
  <polygon points="100,200 190,135 530,135 440,200" fill="#3A86E0"/>
  <polygon points="440,200 530,135 530,300 440,365" fill="#0A3CD9"/>
  <polygon points="100,200 440,200 440,365 100,365" fill="#1E50E0"/>
  <!-- front panel detail -->
  <circle cx="140" cy="240" r="9" fill="#0A3CD9" stroke="#9DBEF5" stroke-width="2"/>
  <circle cx="140" cy="280" r="9" fill="#0A3CD9" stroke="#9DBEF5" stroke-width="2"/>
  <rect x="190" y="235" width="26" height="100" rx="4" fill="#3A6BF0"/>
  <rect x="240" y="235" width="26" height="100" rx="4" fill="#3A6BF0"/>
  <rect x="290" y="235" width="26" height="100" rx="4" fill="#3A6BF0"/>
  <!-- pedestal on top -->
  <polygon points="290,168 330,140 410,140 370,168" fill="#7C8597"/>
  <polygon points="370,168 410,140 410,180 370,208" fill="#5A6270"/>
  <polygon points="290,168 370,168 370,208 290,208" fill="#6B7280"/>
  <!-- source document (white/blue) -->
  <g transform="translate(300,58)">
    <path d="M3,3 H40 L57,20 V92 H3 Z" fill="#FFFFFF" stroke="#0A3CD9" stroke-width="3" stroke-linejoin="round"/>
    <path d="M40,3 V20 H57" fill="none" stroke="#0A3CD9" stroke-width="3" stroke-linejoin="round"/>
    <line x1="11" y1="36" x2="38" y2="36" stroke="#0A3CD9" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="11" y1="50" x2="48" y2="50" stroke="#0A3CD9" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="11" y1="64" x2="48" y2="64" stroke="#0A3CD9" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="11" y1="78" x2="40" y2="78" stroke="#0A3CD9" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- =================== MIDDLE: Slice =================== -->
  <text x="720" y="160" text-anchor="middle" font-size="36" font-weight="700" fill="#1A1A1A">Slice</text>
  <g fill="none" stroke="url(#chev)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="638,182 668,212 638,242"/>
    <polyline points="678,182 708,212 678,242"/>
    <polyline points="718,182 748,212 718,242"/>
    <polyline points="758,182 788,212 758,242"/>
  </g>

  <!-- =================== RIGHT: storage pool + slices =================== -->
  <!-- pool cylinder -->
  <path d="M905,235 V300 A175,40 0 0 0 1255,300 V235 Z" fill="url(#poolG)"/>
  <ellipse cx="1080" cy="235" rx="175" ry="40" fill="#3A86E0"/>

  <!-- highlight ring behind first slice -->
  <circle cx="990" cy="195" r="58" fill="#FF6A00" fill-opacity="0.16" stroke="#FF6A00" stroke-width="3.5"/>

  <!-- three slice documents on top -->
  <use href="#docO" x="958" y="150" width="62" height="80"/>
  <use href="#docO" x="1064" y="150" width="62" height="80"/>
  <use href="#docO" x="1170" y="150" width="62" height="80"/>

  <!-- three storage nodes below -->
  <use href="#db" x="905"  y="470" width="100" height="96"/>
  <use href="#db" x="1030" y="470" width="100" height="96"/>
  <use href="#db" x="1200" y="470" width="100" height="96"/>

  <!-- distribution arrows from highlighted slice to nodes -->
  <line x1="980"  y1="250" x2="955"  y2="466" stroke="#FF6A00" stroke-width="3" marker-end="url(#aO)"/>
  <line x1="995"  y1="252" x2="1080" y2="466" stroke="#FF6A00" stroke-width="3" marker-end="url(#aO)"/>
  <line x1="1010" y1="250" x2="1250" y2="466" stroke="#FF6A00" stroke-width="3" marker-end="url(#aO)"/>
</svg>
