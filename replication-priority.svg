<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="920" viewBox="0 0 1560 920" font-family="'Helvetica Neue','Arial',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAFBFC"/>
      <stop offset="1" stop-color="#F1F3F6"/>
    </linearGradient>
    <marker id="arrO" markerWidth="13" markerHeight="13" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#FF6A00"/>
    </marker>
    <pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse">
      <rect width="13" height="13" fill="#FFFFFF"/>
      <circle cx="4" cy="4" r="2.1" fill="#FF6A00" fill-opacity="0.55"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1560" height="920" fill="#FFFFFF"/>

  <!-- ===== left section labels ===== -->
  <text x="60" y="95"  font-size="26" font-weight="600" fill="#2B2F36">Priority</text>
  <text x="60" y="250" font-size="26" font-weight="600" fill="#2B2F36">Data</text>
  <text x="60" y="282" font-size="26" font-weight="600" fill="#2B2F36">Replication</text>
  <text x="60" y="680" font-size="26" font-weight="600" fill="#2B2F36">Space</text>
  <text x="60" y="712" font-size="26" font-weight="600" fill="#2B2F36">category</text>

  <!-- ===== dashed separators ===== -->
  <line x1="90" y1="188" x2="1500" y2="188" stroke="#C2C8D2" stroke-width="2" stroke-dasharray="9 7"/>
  <line x1="90" y1="402" x2="1500" y2="402" stroke="#C2C8D2" stroke-width="2" stroke-dasharray="9 7"/>

  <!-- ===== PRIORITY arcs + circles ===== -->
  <g fill="none" stroke="#FF6A00" stroke-width="2.5">
    <path d="M580,102 Q500,156 435,206" marker-end="url(#arrO)"/>
    <path d="M580,102 Q660,156 725,206" marker-end="url(#arrO)"/>
    <path d="M725,208 Q800,150 878,100"/>
    <path d="M880,102 Q960,156 1025,206" marker-end="url(#arrO)"/>
    <path d="M1025,208 Q1100,150 1178,100"/>
    <path d="M1180,102 Q1260,156 1325,206" marker-end="url(#arrO)"/>
  </g>
  <g>
    <circle cx="580"  cy="78" r="24" fill="#FFFFFF" stroke="#FF6A00" stroke-width="2.5"/>
    <circle cx="880"  cy="78" r="24" fill="#FFFFFF" stroke="#FF6A00" stroke-width="2.5"/>
    <circle cx="1180" cy="78" r="24" fill="#FFFFFF" stroke="#FF6A00" stroke-width="2.5"/>
    <text x="580"  y="88" text-anchor="middle" font-size="26" font-weight="800" fill="#FF6A00">&gt;</text>
    <text x="880"  y="88" text-anchor="middle" font-size="26" font-weight="800" fill="#FF6A00">&gt;</text>
    <text x="1180" y="88" text-anchor="middle" font-size="26" font-weight="800" fill="#FF6A00">&gt;</text>
  </g>

  <!-- ===== DATA REPLICATION boxes ===== -->
  <g>
    <rect x="330"  y="215" width="200" height="78" rx="12" fill="#FFFFFF" stroke="#0A3CD9" stroke-width="2.5"/>
    <rect x="630"  y="215" width="200" height="78" rx="12" fill="#FFFFFF" stroke="#0A3CD9" stroke-width="2.5"/>
    <rect x="930"  y="215" width="200" height="78" rx="12" fill="#FFFFFF" stroke="#0A3CD9" stroke-width="2.5"/>
    <rect x="1230" y="215" width="200" height="78" rx="12" fill="#FFFFFF" stroke="#0A3CD9" stroke-width="2.5"/>
    <text x="430"  y="266" text-anchor="middle" font-size="28" font-weight="800" fill="#1A1A1A">Recovery</text>
    <text x="730"  y="266" text-anchor="middle" font-size="28" font-weight="800" fill="#1A1A1A">New Data</text>
    <text x="1030" y="266" text-anchor="middle" font-size="28" font-weight="800" fill="#1A1A1A">Shutdown</text>
    <text x="1330" y="266" text-anchor="middle" font-size="28" font-weight="800" fill="#1A1A1A">Rebalance</text>
  </g>
  <g stroke="#FF6A00" stroke-width="3">
    <line x1="335"  y1="308" x2="525"  y2="308"/>
    <line x1="635"  y1="308" x2="825"  y2="308"/>
    <line x1="935"  y1="308" x2="1125" y2="308"/>
    <line x1="1235" y1="308" x2="1425" y2="308"/>
  </g>
  <g text-anchor="middle" font-size="20" font-weight="600" fill="#0A3CD9">
    <text x="430"  y="344">Free</text>
    <text x="730"  y="344">Allocable</text>
    <text x="1030" y="344">Prefer Fillable</text>
    <text x="1330" y="344">Fillable</text>
  </g>

  <!-- ===== SPACE CATEGORY ===== -->
  <!-- group titles -->
  <text x="585"  y="470" text-anchor="middle" font-size="26" font-weight="600" fill="#1A1A1A">Original Data Nodes</text>
  <line x1="430" y1="486" x2="740" y2="486" stroke="#FF6A00" stroke-width="2.5"/>
  <text x="1247" y="470" text-anchor="middle" font-size="26" font-weight="600" fill="#1A1A1A">New Data Nodes</text>
  <line x1="1110" y1="486" x2="1385" y2="486" stroke="#FF6A00" stroke-width="2.5"/>

  <!-- Original Data Nodes: 3 bars (Used = orange, top white = Free/Allocable) -->
  <g>
    <!-- bar 1 -->
    <rect x="360" y="540" width="100" height="320" fill="#FFFFFF" stroke="#FF6A00" stroke-width="2"/>
    <rect x="360" y="650" width="100" height="210" fill="#FF6A00"/>
    <line x1="360" y1="568" x2="460" y2="568" stroke="#FF6A00" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- bar 2 -->
    <rect x="495" y="540" width="100" height="320" fill="#FFFFFF" stroke="#FF6A00" stroke-width="2"/>
    <rect x="495" y="650" width="100" height="210" fill="#FF6A00"/>
    <line x1="495" y1="568" x2="595" y2="568" stroke="#FF6A00" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- ellipsis -->
    <text x="650" y="725" text-anchor="middle" font-size="30" font-weight="700" fill="#8A8F99">...</text>
    <!-- bar 3 -->
    <rect x="705" y="540" width="100" height="320" fill="#FFFFFF" stroke="#FF6A00" stroke-width="2"/>
    <rect x="705" y="650" width="100" height="210" fill="#FF6A00"/>
    <line x1="705" y1="568" x2="805" y2="568" stroke="#FF6A00" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
  <!-- left labels for original -->
  <g font-size="20" font-weight="600" fill="#0A3CD9" text-anchor="end">
    <text x="330" y="560">Free</text>
    <text x="330" y="612">Allocable</text>
    <text x="330" y="760">Used</text>
  </g>
  <g stroke="#0A3CD9" stroke-width="1.5">
    <line x1="338" y1="554" x2="360" y2="554"/>
    <line x1="338" y1="606" x2="360" y2="606"/>
    <line x1="338" y1="755" x2="360" y2="755"/>
  </g>

  <!-- New Data Nodes: 2 bars (Allocable top white, Fillable dotted) -->
  <g>
    <rect x="1130" y="540" width="100" height="320" fill="url(#dots)" stroke="#FF6A00" stroke-width="2"/>
    <rect x="1130" y="540" width="100" height="70" fill="#FFFFFF" stroke="#FF6A00" stroke-width="2"/>
    <rect x="1265" y="540" width="100" height="320" fill="url(#dots)" stroke="#FF6A00" stroke-width="2"/>
    <rect x="1265" y="540" width="100" height="70" fill="#FFFFFF" stroke="#FF6A00" stroke-width="2"/>
  </g>
  <!-- right labels -->
  <g font-size="20" font-weight="600" fill="#0A3CD9">
    <text x="1422" y="582">Allocable</text>
    <text x="1422" y="742">Fillable</text>
  </g>
  <g stroke="#0A3CD9" stroke-width="1.5">
    <line x1="1365" y1="576" x2="1418" y2="576"/>
    <line x1="1365" y1="736" x2="1418" y2="736"/>
  </g>
  <!-- left label Free -->
  <text x="1100" y="742" text-anchor="end" font-size="20" font-weight="600" fill="#0A3CD9">Free</text>
  <line x1="1108" y1="736" x2="1130" y2="736" stroke="#0A3CD9" stroke-width="1.5"/>

  <!-- brand -->
  <text x="1140" y="898" font-size="16" font-weight="800" fill="#0A3CD9" letter-spacing="0.5">ALIBABA CLOUD INTELLIGENCE</text>
  <text x="1452" y="898" font-size="16" font-weight="800" fill="#8A8F99" letter-spacing="0.5">GROUP</text>
</svg>
