<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="920" viewBox="0 0 1560 920" font-family="'Helvetica Neue','Arial',sans-serif">
  <defs>
    <marker id="arrO" markerWidth="14" markerHeight="14" refX="6" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E0822C"/>
    </marker>
    <pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse">
      <rect width="13" height="13" fill="#FFFFFF"/>
      <circle cx="4" cy="4" r="2" fill="#EE7F1A" fill-opacity="0.6"/>
    </pattern>
    <filter id="bsh" x="-15%" y="-15%" width="130%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#9a958c" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1560" height="920" fill="#FFFFFF"/>

  <!-- left section labels -->
  <text x="60" y="95"  font-size="26" fill="#3A3A3A">Priority</text>
  <text x="60" y="250" font-size="26" fill="#3A3A3A">Data</text>
  <text x="60" y="282" font-size="26" fill="#3A3A3A">Replication</text>
  <text x="60" y="680" font-size="26" fill="#3A3A3A">Space</text>
  <text x="60" y="712" font-size="26" fill="#3A3A3A">category</text>

  <!-- dashed separators -->
  <line x1="90" y1="188" x2="1500" y2="188" stroke="#CBC6BE" stroke-width="2" stroke-dasharray="9 7"/>
  <line x1="90" y1="402" x2="1500" y2="402" stroke="#CBC6BE" stroke-width="2" stroke-dasharray="9 7"/>

  <!-- ===== PRIORITY smooth arcs ===== -->
  <g fill="none" stroke="#E0822C" stroke-width="2.5">
    <path d="M560,94 C500,100 430,150 430,206" marker-end="url(#arrO)"/>
    <path d="M600,94 C660,100 730,150 730,206" marker-end="url(#arrO)"/>
    <path d="M730,206 C730,150 800,100 860,94"/>
    <path d="M900,94 C960,100 1030,150 1030,206" marker-end="url(#arrO)"/>
    <path d="M1030,206 C1030,150 1100,100 1160,94"/>
    <path d="M1200,94 C1260,100 1330,150 1330,206" marker-end="url(#arrO)"/>
  </g>
  <g>
    <circle cx="580"  cy="78" r="24" fill="#FFFFFF" stroke="#E0822C" stroke-width="2.5"/>
    <circle cx="880"  cy="78" r="24" fill="#FFFFFF" stroke="#E0822C" stroke-width="2.5"/>
    <circle cx="1180" cy="78" r="24" fill="#FFFFFF" stroke="#E0822C" stroke-width="2.5"/>
    <text x="580"  y="89" text-anchor="middle" font-size="28" font-weight="700" fill="#E0822C">&gt;</text>
    <text x="880"  y="89" text-anchor="middle" font-size="28" font-weight="700" fill="#E0822C">&gt;</text>
    <text x="1180" y="89" text-anchor="middle" font-size="28" font-weight="700" fill="#E0822C">&gt;</text>
  </g>

  <!-- ===== DATA REPLICATION boxes ===== -->
  <g filter="url(#bsh)">
    <rect x="330"  y="215" width="200" height="78" rx="12" fill="#FFFFFF" stroke="#E0822C" stroke-width="2.5"/>
    <rect x="630"  y="215" width="200" height="78" rx="12" fill="#FFFFFF" stroke="#E0822C" stroke-width="2.5"/>
    <rect x="930"  y="215" width="200" height="78" rx="12" fill="#FFFFFF" stroke="#E0822C" stroke-width="2.5"/>
    <rect x="1230" y="215" width="200" height="78" rx="12" fill="#FFFFFF" stroke="#E0822C" stroke-width="2.5"/>
  </g>
  <g text-anchor="middle" font-size="28" font-weight="800" fill="#1A1A1A">
    <text x="430"  y="266">Recovery</text>
    <text x="730"  y="266">New Data</text>
    <text x="1030" y="266">Shutdown</text>
    <text x="1330" y="266">Rebalance</text>
  </g>
  <!-- green underlines -->
  <g stroke="#5C9E3F" stroke-width="2.5">
    <line x1="335"  y1="312" x2="525"  y2="312"/>
    <line x1="635"  y1="312" x2="825"  y2="312"/>
    <line x1="935"  y1="312" x2="1125" y2="312"/>
    <line x1="1235" y1="312" x2="1425" y2="312"/>
  </g>
  <g text-anchor="middle" font-size="21" fill="#5C9E3F">
    <text x="430"  y="346">Free</text>
    <text x="730"  y="346">Allocable</text>
    <text x="1030" y="346">Prefer Fillable</text>
    <text x="1330" y="346">Fillable</text>
  </g>

  <!-- ===== SPACE CATEGORY ===== -->
  <text x="585"  y="470" text-anchor="middle" font-size="26" fill="#3A3A3A">Original Data Nodes</text>
  <line x1="430" y1="486" x2="740" y2="486" stroke="#E0822C" stroke-width="2.5"/>
  <text x="1247" y="470" text-anchor="middle" font-size="26" fill="#3A3A3A">New Data Nodes</text>
  <line x1="1110" y1="486" x2="1385" y2="486" stroke="#E0822C" stroke-width="2.5"/>

  <!-- Original Data Nodes: 3 bars -->
  <g>
    <rect x="360" y="540" width="100" height="320" fill="#FFFFFF" stroke="#E0822C" stroke-width="2"/>
    <rect x="360" y="652" width="100" height="208" fill="#EE7F1A"/>
    <rect x="495" y="540" width="100" height="320" fill="#FFFFFF" stroke="#E0822C" stroke-width="2"/>
    <rect x="495" y="652" width="100" height="208" fill="#EE7F1A"/>
    <text x="650" y="724" text-anchor="middle" font-size="30" font-weight="700" fill="#8A8F99">...</text>
    <rect x="705" y="540" width="100" height="320" fill="#FFFFFF" stroke="#E0822C" stroke-width="2"/>
    <rect x="705" y="652" width="100" height="208" fill="#EE7F1A"/>
  </g>
  <!-- Free/Allocable grouped with a bracket over the empty (white) region -->
  <path d="M353,542 H341 V650 H353" fill="none" stroke="#5C9E3F" stroke-width="1.8"/>
  <g font-size="21" fill="#5C9E3F" text-anchor="end">
    <text x="333" y="588">Free</text>
    <text x="333" y="614">Allocable</text>
    <text x="333" y="762">Used</text>
  </g>
  <line x1="341" y1="756" x2="360" y2="756" stroke="#5C9E3F" stroke-width="1.5"/>

  <!-- New Data Nodes: 2 bars -->
  <g>
    <rect x="1130" y="540" width="100" height="320" fill="url(#dots)" stroke="#E0822C" stroke-width="2"/>
    <rect x="1130" y="540" width="100" height="70" fill="#FFFFFF" stroke="#E0822C" stroke-width="2"/>
    <rect x="1265" y="540" width="100" height="320" fill="url(#dots)" stroke="#E0822C" stroke-width="2"/>
    <rect x="1265" y="540" width="100" height="70" fill="#FFFFFF" stroke="#E0822C" stroke-width="2"/>
  </g>
  <g font-size="21" fill="#5C9E3F">
    <text x="1422" y="582">Allocable</text>
    <text x="1422" y="742">Fillable</text>
  </g>
  <g stroke="#5C9E3F" stroke-width="1.5">
    <line x1="1365" y1="576" x2="1418" y2="576"/>
    <line x1="1365" y1="736" x2="1418" y2="736"/>
  </g>
  <text x="1100" y="742" text-anchor="end" font-size="21" fill="#5C9E3F">Free</text>
  <line x1="1108" y1="736" x2="1130" y2="736" stroke="#5C9E3F" stroke-width="1.5"/>

  <!-- brand -->
  <text x="60" y="898" font-size="15" font-weight="800" fill="#0A3CD9" letter-spacing="0.5">ALIBABA CLOUD INTELLIGENCE</text>
  <text x="360" y="898" font-size="15" font-weight="800" fill="#8A8F99" letter-spacing="0.5">GROUP</text>
</svg>
